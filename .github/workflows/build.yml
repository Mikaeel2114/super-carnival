name: Build LumaLink Flutter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name lumalink .
          python3 tools/configure_android.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: LumaLink-Flutter-Android
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Visual Studio 2022 build tools
        uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows --project-name lumalink .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: python -m pip install "Pillow>=10.4,<12" pyinstaller
      - run: python -m unittest discover -s tests -v
      - name: Build screen capture helper
        run: pyinstaller --noconfirm --onefile --name lumalink_host --distpath backend/dist backend/bridge.py
      - run: flutter build windows --release
      - name: Package screen capture helper
        run: Copy-Item backend/dist/lumalink_host.exe build/windows/x64/runner/Release/lumalink_host.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LumaLink-Flutter-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
